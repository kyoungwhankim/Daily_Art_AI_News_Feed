# 매주 월요일, config.js의 서비스 업데이트 출처(notice·dev 주소)가 열리는지 확인한다.
# 열리지 않는 주소가 있으면 이 작업이 실패해서 GitHub가 알림(메일)을 보낸다.
# 403(사이트가 자동 접속을 막음)은 실패로 세지 않는다 — 결과 로그에 '--'로 표시된다.
# Actions 탭에서 'Run workflow'로 바로 돌릴 수도 있다. 필요한 Secret은 없다.
name: Check update sources

on:
  schedule:
    - cron: '17 0 * * 1'   # 월요일 09:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sources
        run: python3 scripts/check_update_sources.py
