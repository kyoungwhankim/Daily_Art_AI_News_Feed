# main에 push될 때마다 정적 사이트를 만들어 Cloudflare Pages(https://ai-art-news.pages.dev)에 배포한다.
# 예전 주소(GitHub Pages, kyoungwhankim.github.io/Daily_Art_AI_News_Feed/)에는
# 같은 경로의 새 주소로 넘겨 주는 안내 페이지만 배포한다.
# 만든 파일(_site/)은 레포에 커밋하지 않는다 — scripts/build_site.py 참고.
# PR에서는 빌드만 확인하고 배포하지 않는다.
# claude/** 브랜치에 push하면 미리보기 주소(https://preview.ai-art-news.pages.dev, 검색 차단)에만 배포한다.
#
# 필요한 레포 Secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
# 레포 Settings → Pages → Source 는 "GitHub Actions" (예전 주소 안내 페이지용).
name: Deploy site

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}', github.ref) || (github.ref == 'refs/heads/main' && 'deploy' || 'preview') }}
  cancel-in-progress: false

env:
  CF_PROJECT: ai-art-news
  SITE_URL: https://ai-art-news.pages.dev
  IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  IS_PREVIEW: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data
        run: python3 scripts/validate_data.py
      - name: Build site
        run: python3 scripts/build_site.py --out _site
        env:
          PREVIEW: ${{ env.IS_PREVIEW == 'true' && '1' || '' }}

      - name: Deploy preview to Cloudflare Pages (preview.ai-art-news.pages.dev)
        if: env.IS_PREVIEW == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name "$CF_PROJECT" --branch preview --commit-dirty=true
      - name: Build redirect site for the old address
        run: python3 scripts/build_site.py --redirect-site _redirect

      - name: Deploy to Cloudflare Pages
        if: env.IS_MAIN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 첫 배포 때 프로젝트를 만든다 (이미 있으면 그냥 넘어간다)
          npx --yes wrangler@4 pages project create "$CF_PROJECT" --production-branch main || true
          npx --yes wrangler@4 pages deploy _site --project-name "$CF_PROJECT" --branch main --commit-dirty=true

      - name: Check the new address serves this site
        if: env.IS_MAIN == 'true'
        run: |
          # 예전 주소를 넘기기 전에, 새 주소가 정말 이 사이트인지 확인한다
          # (프로젝트 이름이 이미 쓰이고 있어 주소가 달라졌다면 여기서 멈춘다)
          for i in $(seq 1 20); do
            if curl -fsS "$SITE_URL/robots.txt" | grep -qx "Sitemap: $SITE_URL/sitemap.xml"; then
              echo "OK: $SITE_URL"; exit 0
            fi
            sleep 15
          done
          echo "::error::$SITE_URL does not serve this site yet — check the Cloudflare Pages project's address"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        if: env.IS_PREVIEW != 'true'
        with:
          path: _redirect

  deploy-redirect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
