<svg xmlns="http://www.w3.org/2000/svg" viewBox="98 100 304 296" width="100%" height="100%">
  <defs>
    <!-- 세련되고 진취적인 그라데이션 -->
    <linearGradient id="perfectBlendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b5998" />
      <stop offset="50%" stop-color="#4e54c8" />
      <stop offset="100%" stop-color="#12c2e9" />
    </linearGradient>
  </defs>

  <!-- 
    [수학적 탄젠트 블렌딩 삼각형 설계]
    - 정삼각형 꼭짓점을 기준으로 모서리 반경(R) 45가 변과 완벽한 접점(Tangent)을 이루도록 설계
    - 직선과 호의 경계면에 미세한 꺾임이나 찌그러짐이 존재하지 않는 연속적인 벡터 패스입니다.
  -->
  <path d="
    M 211.03 152.50
    A 45 45 0 0 1 288.97 152.50
    L 373.97 299.71
    A 45 45 0 0 1 335.00 367.22
    L 165.00 367.22
    A 45 45 0 0 1 126.03 299.71
    Z"
    fill="none"
    stroke="url(#perfectBlendGrad)"
    stroke-width="50"
    stroke-linejoin="round"
    stroke-linecap="round" />
</svg>
